[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-docker"
version = "0.2.0"
description = "Wyoming and OpenAI-compatible speech-to-text server for NVIDIA Parakeet"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jonathan Woodbury", email = "jpwoodbu@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "wyoming==1.8.0",
    "onnx-asr[cpu,hub]",
    "aiohttp>=3.11",
    "numpy>=1.22.4",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/gargomoma/parakeet-docker"
Upstream = "https://github.com/jpwoodbu/wyoming-parakeet"
